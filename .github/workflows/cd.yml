name: cd

on:
  push

jobs:
  build_and_publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Build app
        run: ./scripts/buildprod.sh

      - name: Login to GHCR
        run: docker login --username itawhite --password ${{ secrets.GH_TOKEN }} ghcr.io

      - name: Build image
        run: docker build . --tag ghcr.io/itawhite/notely-api:latest

      - name: Push image
        run: docker push ghcr.io/itawhite/notely-api:latest